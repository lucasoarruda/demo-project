# Dependabot version updates. Everything targets develop, the only long-lived
# branch (it is what CI builds and ArgoCD deploys).
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/golang"
    schedule:
      interval: "weekly"
    target-branch: "develop"
  - package-ecosystem: "gomod"
    directory: "/loadtest"
    schedule:
      interval: "weekly"
    target-branch: "develop"
  - package-ecosystem: "terraform"
    directory: "/aws/eks-blueprint" # where the .tf files live (was /aws, which has none)
    schedule:
      interval: "weekly"
    target-branch: "develop"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
