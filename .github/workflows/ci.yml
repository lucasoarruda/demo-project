name: Build and Push

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [golang, loadtest]
    steps:
    - uses: actions/checkout@v7
    - name: Forbid //nolint directives
      # golangci-lint cannot disable //nolint itself, and a bare //nolint also
      # silences nolintlint, so reject any directive (same match as golangci-lint).
      run: |
        if grep -rnE --include='*.go' '//[/ ]*nolint([ :]|$)' ${{ matrix.module }}; then
          echo "::error:://nolint directives are not allowed; fix the finding instead."
          exit 1
        fi
    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ matrix.module }}/go.mod
        cache-dependency-path: ${{ matrix.module }}/go.mod
    - uses: golangci/golangci-lint-action@v9
      with:
        version: v2.14.0
        working-directory: ${{ matrix.module }}

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: golang
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: golang/go.mod
        cache-dependency-path: golang/go.sum
    - name: Vet
      run: go vet ./...
    - name: Test
      run: go test -race ./...

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.ref.outputs.image }}
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Image metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        # :develop on pushes, :pr-<n> on pull requests, plus :sha-<short>.
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha
    - name: Short commit SHA
      id: vars
      run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
    - name: Build and push
      id: push
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          GIT_COMMIT=${{ steps.vars.outputs.short_sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Image reference for scanning
      id: ref
      run: echo "image=${REGISTRY}/${IMAGE_NAME}@${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # Scans the exact image digest this run just pushed, so it can never race
  # the push or pick up an older/newer :develop. trivy.yml keeps the weekly
  # rescan of :develop for newly disclosed CVEs.
  trivy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload-sarif
      actions: read          # upload-sarif on private repos
    steps:
    - uses: actions/checkout@v7 # upload-sarif expects the repo checked out
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0 (SHA-pinned after the 2026 tag compromise)
      with:
        image-ref: ${{ needs.build.outputs.image }}
        format: 'sarif'
        output: 'trivy-results.sarif'
        severity: 'CRITICAL,HIGH'
        version: 'v0.74.0' # Trivy CLI; the action's default lags behind
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: 'trivy-results.sarif'
        category: trivy-image
