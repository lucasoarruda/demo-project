name: Build and Push

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [golang, loadtest]
    steps:
    - uses: actions/checkout@v7
    - name: Forbid //nolint directives
      # golangci-lint cannot disable //nolint itself, and a bare //nolint also
      # silences nolintlint, so reject any directive (same match as golangci-lint).
      run: |
        if grep -rnE --include='*.go' '//[/ ]*nolint([ :]|$)' ${{ matrix.module }}; then
          echo "::error:://nolint directives are not allowed; fix the finding instead."
          exit 1
        fi
    - uses: actions/setup-go@v7
      with:
        go-version-file: ${{ matrix.module }}/go.mod
        cache-dependency-path: ${{ matrix.module }}/go.mod
    - uses: golangci/golangci-lint-action@v9
      with:
        version: v2.14.0
        working-directory: ${{ matrix.module }}

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: golang
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-go@v7
      with:
        go-version-file: golang/go.mod
        cache-dependency-path: golang/go.sum
    - name: Vet
      run: go vet ./...
    - name: Test
      run: go test -race ./...

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
    - uses: actions/checkout@v7
    - uses: docker/setup-buildx-action@v4
    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Image metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        # :develop on pushes, :pr-<n> on pull requests, plus :sha-<short>.
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha
    - name: Short commit SHA
      id: vars
      run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          GIT_COMMIT=${{ steps.vars.outputs.short_sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
