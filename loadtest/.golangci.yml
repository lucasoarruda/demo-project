version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - nolintlint
    - unconvert
    - usestdlibvars
  settings:
    # //nolint directives are rejected outright by CI (see .github/workflows/ci.yml).
    # This is a second line of defence in case one slips through.
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true
  exclusions:
    generated: strict
    paths:
      - docs # generated by swag

formatters:
  enable:
    - gofmt
    - goimports
